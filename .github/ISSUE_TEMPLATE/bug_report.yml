name: Bug report
description: Report a reproducible problem in the weather app.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Launch the app..."
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "Android version / iOS version / emulator"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys and personal information before posting.
